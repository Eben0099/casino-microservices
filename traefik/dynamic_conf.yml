http:
  routers:
    agent-api-router:
      rule: "PathPrefix(`/api/agents`)"
      service: agent-service
      priority: 100
      entryPoints:
        - web

    ticket-api-router:
      rule: "PathPrefix(`/api/tickets`)"
      service: ticket-service
      priority: 100
      entryPoints:
        - web

    roulette-api-router:
      rule: "PathPrefix(`/api/roulette`)"
      service: roulette-service
      priority: 100
      middlewares:
        - roulette-stripprefix
      entryPoints:
        - web

    roulette-ws-router:
      rule: "PathPrefix(`/ws/roulette`)"
      service: roulette-service
      priority: 100
      entryPoints:
        - web

    keno-api-router:
      rule: "PathPrefix(`/api/keno`)"
      service: keno-service
      priority: 100
      middlewares:
        - keno-stripprefix
      entryPoints:
        - web

    keno-ws-router:
      rule: "PathPrefix(`/ws/keno`)"
      service: keno-service
      priority: 100
      entryPoints:
        - web

    keno-volkeno-ws-router:
      rule: "PathPrefix(`/ws/volkeno`)"
      service: keno-service
      priority: 100
      entryPoints:
        - web

    jackpot-api-router:
      rule: "PathPrefix(`/api/jackpots`)"
      service: jackpot-service
      priority: 100
      middlewares:
        - jackpot-stripprefix
      entryPoints:
        - web

    agent-web-router:
      rule: "PathPrefix(`/agents/pos`)"
      service: agent-web-service
      priority: 10
      entryPoints:
        - web

    # Catch-all pour le backoffice
    backoffice-router:
      rule: "PathPrefix(`/`)"
      service: backoffice-service
      priority: 1
      entryPoints:
        - web

  middlewares:
    agent-stripprefix:
      stripPrefix:
        prefixes:
          - "/agents/pos"
    roulette-stripprefix:
      stripPrefix:
        prefixes:
          - "/api/roulette"
    keno-stripprefix:
      stripPrefix:
        prefixes:
          - "/api/keno"
    jackpot-stripprefix:
      stripPrefix:
        prefixes:
          - "/api/jackpots"

  services:
    # URLs reference docker-compose service names (not container names) so
    # Docker's internal DNS load-balances across all replicas when scaled.
    agent-service:
      loadBalancer:
        servers:
          - url: "http://agent-service:8000"

    ticket-service:
      loadBalancer:
        servers:
          - url: "http://ticket-service:8000"

    roulette-service:
      loadBalancer:
        servers:
          - url: "http://game-roulette-service:8000"

    keno-service:
      loadBalancer:
        servers:
          - url: "http://game-keno-service:8000"

    jackpot-service:
      loadBalancer:
        servers:
          - url: "http://jackpot-service:8000"

    agent-web-service:
      loadBalancer:
        servers:
          - url: "http://agent-web:5173"

    backoffice-service:
      loadBalancer:
        servers:
          - url: "http://backoffice-web:5173"
