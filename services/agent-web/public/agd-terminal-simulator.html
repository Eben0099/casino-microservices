<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>AGD terminal webview simulator — agent-web embed</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0a0e1a;
        color: #e8eaee;
      }
      header {
        background: #0e1422;
        padding: 12px 20px;
        border-bottom: 1px solid #1c2336;
        display: flex;
        gap: 16px;
        align-items: center;
        flex-wrap: wrap;
      }
      header h1 { font-size: 14px; margin: 0; letter-spacing: 0.15em; }
      header label { font-size: 12px; opacity: 0.7; }
      header input, header textarea {
        background: #161c2e;
        color: #e8eaee;
        border: 1px solid #2a3354;
        border-radius: 4px;
        padding: 4px 8px;
        font-size: 12px;
        font-family: ui-monospace, Menlo, monospace;
      }
      header textarea { min-width: 520px; min-height: 28px; }
      header button {
        background: #314ee7;
        color: #fff;
        border: 0;
        padding: 6px 14px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 12px;
        font-weight: 600;
      }
      header button:hover { background: #4060f0; }
      .events {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        max-height: 30vh;
        overflow-y: auto;
        background: #050810ee;
        font-family: ui-monospace, Menlo, monospace;
        font-size: 11px;
        padding: 8px 12px;
        border-top: 1px solid #1c2336;
      }
      .events div { margin: 2px 0; }
      iframe {
        display: block;
        width: 100%;
        height: calc(100vh - 64px - 30vh);
        border: 0;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>AGD WEBVIEW SIMULATOR</h1>
      <label>iframe src
        <input id="src" value="/agents/pos/?embed=1" />
      </label>
      <label>JWT
        <textarea id="jwt" placeholder="paste agent-web JWT here…"></textarea>
      </label>
      <button id="reload">Reload iframe</button>
      <button id="send">Send agd:auth</button>
      <button id="logout">Send agd:logout</button>
    </header>
    <iframe id="frame" src="/agents/pos/?embed=1"></iframe>
    <div class="events" id="events">// waiting for iframe ready…</div>

    <script>
      const $ = (id) => document.getElementById(id);
      const log = (m) => {
        const d = document.createElement("div");
        d.textContent = "[" + new Date().toLocaleTimeString() + "] " + m;
        $("events").prepend(d);
      };
      const frame = $("frame");

      $("reload").onclick = () => {
        frame.src = $("src").value;
        log("iframe reloaded: " + frame.src);
      };

      $("send").onclick = () => {
        const token = $("jwt").value.trim();
        if (!token) {
          log("ERR: paste a JWT first");
          return;
        }
        frame.contentWindow?.postMessage(
          { type: "agd:auth", token, user: { name: "Operator (simulated)" } },
          "*",
        );
        log("posted agd:auth with JWT (" + token.slice(0, 12) + "…)");
      };

      $("logout").onclick = () => {
        frame.contentWindow?.postMessage({ type: "agd:logout" }, "*");
        log("posted agd:logout");
      };

      window.addEventListener("message", (e) => {
        if (!e.data || typeof e.data !== "object") return;
        log("RECV from iframe: " + JSON.stringify(e.data));
      });
    </script>
  </body>
</html>
